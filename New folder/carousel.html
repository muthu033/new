<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoga Carousel</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Flowbite CSS -->
  <link 
    href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" 
    rel="stylesheet"
  />

  <style>
    body {
      background: linear-gradient(to bottom, #fafafa, #f5f5f5);
    }
  </style>
</head>

<body class="flex items-center justify-center h-screen">

  <!-- Carousel Container -->
  <div id="default-carousel" class="relative w-full max-w-5xl" data-carousel="slide">

    <!-- Carousel Wrapper -->
    <div class="relative h-96 overflow-hidden rounded-lg shadow-xl">

      <!-- Slide 1 -->
      <div class="hidden duration-700 ease-in-out" data-carousel-item>
        <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1200&q=60" 
             class="absolute block w-full h-full object-cover" 
             alt="Yoga pose 1" />
      </div>

      <!-- Slide 2 -->
      <div class="hidden duration-700 ease-in-out" data-carousel-item="active">
        <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1200&q=60" 
             class="absolute block w-full h-full object-cover" 
             alt="Yoga pose 2" />
      </div>

      <!-- Slide 3 -->
      <div class="hidden duration-700 ease-in-out" data-carousel-item>
        <img src="https://images.unsplash.com/photo-1554344058-54e2831d58f6?auto=format&fit=crop&w=1200&q=60" 
             class="absolute block w-full h-full object-cover" 
             alt="Yoga pose 3" />
      </div>

    </div>

    <!-- Slider Controls -->
    <button type="button"
            class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
            data-carousel-prev>
      <span
        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/60 group-hover:bg-white/80">
        <svg class="w-4 h-4 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 19l-7-7 7-7" />
        </svg>
      </span>
    </button>

    <button type="button"
            class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
            data-carousel-next>
      <span
        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/60 group-hover:bg-white/80">
        <svg class="w-4 h-4 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5l7 7-7 7" />
        </svg>
      </span>
    </button>

  </div>

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
