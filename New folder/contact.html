<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avani | Signup</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

  <style>
    .gold-gradient {
      background: linear-gradient(135deg, #ffd700, #000);
    }
  </style>
</head>
<body class="font-sans text-gray-800">
  <!-- contact -->
   <div class="grid md:grid-cols-2 gap-6 w-full max-w-6xl">
    <!-- LEFT SIDE (IMAGE + TEXT) -->
    <div class="relative rounded-2xl overflow-hidden shadow-lg">
      <img src="https://cdn.pixabay.com/photo/2020/09/08/09/04/yoga-5554272_1280.jpg" alt="Yoga Pose" class="w-full h-full object-cover rounded-2xl" />

      <div class="absolute inset-0 bg-white/10 flex flex-col justify-center px-10">
        <!-- Play Button -->
        <div class="flex items-center mb-8">
          <button class="w-20 h-20 border-2 border-[#c7b8a1] rounded-full flex items-center justify-center hover:bg-[#c7b8a1]/20 transition">
            <svg class="w-8 h-8 text-[#c7b8a1]" fill="currentColor" viewBox="0 0 20 20">
              <path d="M6.5 5.5l7 4.5-7 4.5v-9z"/>
            </svg>
          </button>
        </div>

        <h1 class="text-5xl md:text-6xl font-serif font-bold text-gray-800 mb-4">Perfect Poses For You</h1>
        <p class="text-lg text-gray-600 font-medium">Stay Calm Be Healthy</p>
      </div>
    </div>

    <!-- RIGHT SIDE (CONTACT FORM) -->
    <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8 flex flex-col justify-center">
      <h2 class="text-4xl font-serif font-semibold text-gray-800 mb-6">Contact Us</h2>

      <form id="contactForm" class="space-y-5">
        <!-- Name -->
        <div>
          <input type="text" id="name" placeholder="Name*" required 
                 class="w-full bg-[#f3eee8] rounded-lg p-3 focus:ring-2 focus:ring-[#c7b8a1] focus:outline-none" />
        </div>

        <!-- Phone -->
        <div>
          <input type="tel" id="phone" placeholder="Phone Number*" required 
                 class="w-full bg-[#f3eee8] rounded-lg p-3 focus:ring-2 focus:ring-[#c7b8a1] focus:outline-none" />
        </div>

        <!-- Date -->
        <div>
          <input type="date" id="date" placeholder="dd-mm-yyyy" 
                 class="w-full bg-[#f3eee8] rounded-lg p-3 text-gray-700 focus:ring-2 focus:ring-[#c7b8a1] focus:outline-none" />
        </div>

        <!-- Message -->
        <div>
          <textarea id="message" rows="4" placeholder="Message" 
                    class="w-full bg-[#f3eee8] rounded-lg p-3 focus:ring-2 focus:ring-[#c7b8a1] focus:outline-none"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button type="submit" 
                  class="flex items-center justify-center gap-2 mx-auto border-2 border-gray-700 rounded-full px-8 py-3 text-gray-800 hover:bg-gray-800 hover:text-white transition">
            Send Message
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25L21 12l-3.75 3.75M21 12H3" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script>
    // Simple form submission handler (frontend only)
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Message sent successfully!');
      this.reset();
    });
  </script>
</body>
</html>
